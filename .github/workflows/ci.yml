name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check public audience
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DAIMON_PRIVATE_TERMS: ${{ secrets.DAIMON_PRIVATE_TERMS }}
        run: tools/audience-check.sh --tree HEAD --mask --require-terms
      - name: Check public identifiers in fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: tools/audience-check.sh --tree HEAD --mask
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build
