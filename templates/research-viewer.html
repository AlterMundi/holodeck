<!doctype html><html lang="es" data-style-policy="inherit"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Investigación · Holodeck</title>
<link rel="stylesheet" href="research.css"><script src="artifact-style.js" defer></script><script src="research.js" type="module"></script>
<body><main><header><div class="brand">HOLODECK <span>ficha de investigación</span></div><span class="tag" id="status">Abriendo edición</span></header>
<div id="loading" role="status">Abriendo esta edición…</div><button id="retry" hidden>Volver a intentar</button>
<div id="workspace" hidden><div class="intro"><p id="place" class="eyebrow"></p><h1 id="subject"></h1><p class="lead">Un objeto para recorrer lo que aprendemos.</p></div>
<div class="layout"><section class="model-card" aria-label="Objeto de la investigación"><div id="model" class="model-stage" aria-label="Modelo 3D"></div><p id="model-state"></p></section>
<section class="notebook" aria-label="Contenido de la investigación"><div class="tabs" role="tablist" aria-label="Explorar esta investigación"><button role="tab" id="tab-history" aria-controls="history" aria-selected="false" tabindex="-1">Historia</button><button role="tab" id="tab-research" aria-controls="research" aria-selected="true">Investigación</button><button role="tab" id="tab-designs" aria-controls="designs" aria-selected="false" tabindex="-1">Muñequitos 3D</button></div>
<div class="content"><div role="tabpanel" aria-labelledby="tab-history" id="history" hidden></div><div role="tabpanel" aria-labelledby="tab-research" id="research"></div><div role="tabpanel" aria-labelledby="tab-designs" id="designs" hidden></div></div></section></div>
<footer><span id="edition"></span><span>Las ediciones conservan sus fuentes y versiones.</span></footer></div></main></body></html>
