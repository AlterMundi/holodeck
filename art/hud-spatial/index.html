<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cuatro propuestas interactivas de HUD espacial para Holodeck.">
<title>Holodeck · HUD espacial</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="module" src="preview.js"></script>
</head>
<body data-look="orbita">
<main>
  <header class="mast">
    <div class="brand"><i aria-hidden="true"></i> Holodeck</div>
    <nav class="choices" aria-label="Propuestas de HUD">
      <button type="button" data-look="orbita" aria-pressed="true">Órbita</button>
      <button type="button" data-look="umbral" aria-pressed="false">Umbral</button>
      <button type="button" data-look="pulso" aria-pressed="false">Pulso</button>
      <button type="button" data-look="estratos" aria-pressed="false">Estratos</button>
    </nav>
  </header>
  <section class="stage" aria-labelledby="title" id="stage">
    <div class="scenery" aria-hidden="true"></div>
    <canvas id="view" aria-hidden="true"></canvas>
    <div class="intro">
      <p id="domain">Navegación</p>
      <h1 id="title">Órbita</h1>
      <p id="detail">El Anillo en relieve. Giralo para elegir el próximo punto del recorrido.</p>
    </div>
    <div class="reticle" aria-hidden="true"><i></i><i></i></div>
    <div id="a11y" class="sr"></div>
    <div id="readout" class="sr" role="status"></div>
    <p id="fallback" class="fallback" hidden>La vista 3D no está disponible en este navegador.</p>
  </section>
  <footer><span id="gesture">Arrastrá para mirar alrededor</span><div class="footer-tools"><button type="button" id="effects" aria-pressed="true">Efectos</button><button type="button" id="recenter">Recentrar</button></div></footer>
</main>
</body>
</html>
